[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "targeted-oncology-resistance-bypass-engine"
version = "0.1.0"
description = "Targeted Oncology Resistance Bypass Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "networkx>=3.2.1",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "gql>=3.5.0",
    "tenacity>=8.2.3",
    "diskcache>=5.6.3",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
